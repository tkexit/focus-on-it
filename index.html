<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A quiet place to see your horizon. Three slow questions a day — nothing else."
    />
    <title>Focus On It</title>

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Paper color before CSS loads: no white flash in dark mode. -->
    <style>
      html { background: #f5f2ec; }
      @media (prefers-color-scheme: dark) {
        html { background: #1c1915; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
